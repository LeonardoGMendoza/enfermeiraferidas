services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: enfermeira_frontend
    restart: always
    ports:
      - "3001:80"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: enfermeira_backend
    restart: always
    ports:
      - "3002:3000"
    environment:
      - DB_USER=${DB_USER}
      - DB_HOST=${DB_HOST}
      - DB_DATABASE=${DB_DATABASE}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=${DB_PORT}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
